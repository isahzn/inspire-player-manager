# CI — release gate item 1: "CI green on the release commit" (TESTING_AND_ACCEPTANCE §4).
#
# What this runs, and why each thing is here:
#   · typecheck  — tsc over src, scripts, spec AND tests (tsconfig.json includes tests)
#   · build      — the same compile the image ships, so a build break is a red commit
#   · openapi    — regenerate api/openapi.yaml from the contract registry
#   · openapi:lint — prove the generated document is valid
#   · test:all   — unit + db + integration against real PostgreSQL (vitest.config.ts)
#   · doc tools  — the two scripted consistency checks PROJECT_STATUS claims are reproducible
#
# NO SERVICE CONTAINER, DELIBERATELY. This project's local database is the real PostgreSQL
# binaries that `embedded-postgres` ships, driven with pg_ctl by `backend/scripts/db.ts` on
# port 55432 (`db:up` initialises the cluster, creates ia_dev and ia_test, and waits for a
# real connection). CI uses exactly the path a developer uses, so CI cannot pass on a
# different database from the one the tests were written against.
#
# No secrets are used. The values below are the development ones from backend/.env.example.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, build, contract, tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Development credentials, identical to backend/.env.example. CI uses no real secret.
      DATABASE_URL: postgres://ia_app:ia_app_dev_password@localhost:55432/ia_dev
      DATABASE_MIGRATOR_URL: postgres://ia_migrator:ia_migrator_dev_password@localhost:55432/ia_dev
      DATABASE_SUPERUSER_URL: postgres://postgres:ia_postgres_dev_password@localhost:55432/postgres
      # The test run's own secrets are supplied by vitest.config.ts (NODE_ENV=test).
      CI: "true"
      REDOCLY_TELEMETRY: "false"
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # The test config loads `.env` (dotenv). It is gitignored, so CI creates it from the
      # committed template.
      - name: Create the environment file
        run: cp .env.example .env

      - name: Start the local PostgreSQL cluster
        run: npm run db:up

      - name: Bootstrap roles and apply migrations + seed
        run: npm run db:setup

      - name: Typecheck (src, scripts, spec and tests)
        run: npm run typecheck

      - name: Build
        run: npm run build

      # NOT IN CI: `git diff --exit-code ../api/openapi.yaml` after this step, which would
      # turn contract drift (release gate item 8) into a red build. Leaving it out because
      # the committed `api/openapi.yaml` was last generated by hand and a diff check would
      # fail on unrelated whitespace/CRLF until it is regenerated and committed once.
      - name: Regenerate the OpenAPI document from the contract registry
        run: npm run openapi

      - name: Lint the OpenAPI document
        run: npm run openapi:lint

      - name: Tests (unit + database + integration)
        run: npm run test:all

      - name: Stop the local PostgreSQL cluster
        if: always()
        run: npm run db:down

  docs:
    name: Documentation consistency
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Both tools are dependency-free. `check-stale-refs.mts` is TypeScript run directly,
      # which Node 24 does without a flag; Node 22 needs the explicit experimental flag.
      - name: Every relative documentation link resolves
        run: node tools/check-links.mjs

      - name: No unexplained stale provider references
        run: node --experimental-strip-types tools/check-stale-refs.mts

      - name: The stale-reference checker's own rules still hold
        run: node --experimental-strip-types tools/check-stale-refs.mts --self-test
