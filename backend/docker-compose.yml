# Dev services for environments that have Docker.
# This machine does NOT have Docker (see backend/README.md §"Running the database"),
# where `npm run db:up` starts an equivalent PostgreSQL 16 via embedded-postgres instead.
#
# Ports are deliberately non-default so a local Docker stack cannot collide with
# anything else on the developer's machine.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ia_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ia_postgres_dev_password
      POSTGRES_DB: ia_dev
    ports:
      - "55432:5432"
    volumes:
      - ia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ia_dev"]
      interval: 5s
      timeout: 5s
      retries: 20
    command:
      # Deterministic-ish behavior for constraint/index tests.
      - "postgres"
      - "-c"
      - "timezone=UTC"

  minio:
    image: minio/minio:latest
    container_name: ia_minio
    environment:
      MINIO_ROOT_USER: ia_minio_dev
      MINIO_ROOT_PASSWORD: ia_minio_dev_password
    ports:
      - "59000:9000"
      - "59001:9001"
    volumes:
      - ia_miniodata:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the private bucket on first start, then exits.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set ia http://minio:9000 ia_minio_dev ia_minio_dev_password &&
      mc mb --ignore-existing ia/ia-private &&
      mc anonymous set none ia/ia-private &&
      echo 'bucket ia-private ready (private)'
      "

volumes:
  ia_pgdata:
  ia_miniodata:
