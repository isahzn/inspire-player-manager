openapi: 3.1.0
info:
  title: Inspire Academy management system API
  version: 0.1.0-draft
  license:
    name: Proprietary — Inspire Academy
  description: |-
    Generated from the contract registry (`backend/spec/**`) — do not edit by hand.

    Conventions (API_CONTRACTS §1): base path `/api/v1`; JSON with camelCase fields;
    money as integer minor units named `*Minor`; business dates `YYYY-MM-DD`
    academy-local; instants ISO-8601 UTC; cookie session plus a required
    `X-CSRF-Token` header on every non-GET request (AUTH_AND_PERMISSIONS §2);
    `Idempotency-Key` required where marked `x-ia-idempotent`; every response carries
    `X-Request-Id`; pagination `?page&pageSize` → `{data, meta}`; errors always use the
    `ApiError` envelope.

    `x-ia-milestone` names the milestone that implements the endpoint
    (IMPLEMENTATION_PLAN §2). Endpoints documented here but owned by a later
    milestone are not served yet.
servers:
  - url: /api/v1
    description: Same-origin / reverse-proxied deployment
tags:
  - name: Auth
    description: AUTH-01..07 — sign-in, sessions, TOTP
  - name: Users
    description: USR-01..05 — owner-managed users and invites
  - name: Settings
    description: SET-01..08 — academy, billing, messaging configuration
  - name: Groups
    description: GRP/FEE/CCH — age groups, fees, coach assignments
  - name: Players
    description: PLY/GDN — players, guardians, history
  - name: Attendance
    description: SCH/SES/ATT — schedules, sessions, attendance
  - name: CoachTime
    description: CAT — coach check-in/out and corrections
  - name: Billing
    description: BIL/INV/PAY/PRF/RCT — invoices, payments, proofs, receipts
  - name: Public
    description: PUB — token-authenticated invoice links
  - name: Messaging
    description: MSG/WHK — WhatsApp queue, templates, webhook
  - name: Dashboard
    description: DSH-01/02 — owner and coach dashboards
  - name: Reports
    description: RPT-01/02 — reports and CSV export
  - name: Admin
    description: AUD/SYS/IMP — audit, health, CSV import
components:
  schemas:
    PageMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0
      required:
        - page
        - pageSize
        - total
        - totalPages
    ApiError:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable machine code, UPPER_SNAKE
            message:
              type: string
              description: Safe, human-readable English message
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  issue:
                    type: string
                  meta:
                    type: object
                    additionalProperties: {}
                required:
                  - issue
            requestId:
              type: string
          required:
            - code
            - message
            - requestId
      required:
        - error
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        username:
          type: string
          pattern: ^[a-z0-9._-]{3,32}$
          description: Login identifier; case-insensitive unique; immutable (ADR-018)
        fullName:
          type: string
          maxLength: 120
        phone:
          type: string
          description: E.164
        role:
          type: string
          enum:
            - owner
            - coach
        status:
          type: string
          enum:
            - invited
            - active
            - disabled
        totpEnabled:
          type: boolean
        lastLoginAt:
          type: string
          format: date-time
          description: Instant, ISO-8601 UTC
      required:
        - id
        - username
        - fullName
        - role
        - status
        - totpEnabled
    Me:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        csrfToken:
          type: string
          description: Bound to the session; echo on X-CSRF-Token for non-GET
        academy:
          type: object
          properties:
            name:
              type: string
            timezone:
              type: string
            logoUrl:
              type: string
          required:
            - name
            - timezone
        permissions:
          type: array
          items:
            type: string
          description: Permission strings for this role (AUTH §4)
        assignedGroupIds:
          type: array
          items:
            type: string
            format: uuid
            description: UUID (UUIDv7; sorts by creation time)
          description: Coach only
      required:
        - user
        - csrfToken
        - academy
        - permissions
    AuthSession:
      type: object
      properties:
        id:
          type: string
          description: Opaque session id (the raw token lives only in the cookie)
        createdAt:
          type: string
          format: date-time
          description: Instant, ISO-8601 UTC
        lastSeenAt:
          type: string
          format: date-time
          description: Instant, ISO-8601 UTC
        ip:
          type: string
        userAgent:
          type: string
        current:
          type: boolean
          description: True for the session making the request
      required:
        - id
        - createdAt
        - lastSeenAt
        - current
    CreateUserResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        inviteUrl:
          type: string
          description: Shown once; contains the single-use invite token
        inviteExpiresAt:
          type: string
          format: date-time
          description: Instant, ISO-8601 UTC
      required:
        - user
        - inviteUrl
        - inviteExpiresAt
    PaymentMethod:
      type: object
      properties:
        code:
          type: string
          description: Immutable after creation; deactivate instead of deleting
        label:
          type: string
        requiresReference:
          type: boolean
        isActive:
          type: boolean
      required:
        - code
        - label
        - requiresReference
        - isActive
    AcademySettings:
      type: object
      properties:
        name:
          type: string
        shortName:
          type: string
        address:
          type: string
        phone:
          type: string
        email:
          type: string
        paymentInstructions:
          type: string
          description: Printed on invoices (bank details etc.)
        beneficiaryAccounts:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              accountMasked:
                type: string
            required:
              - name
              - accountMasked
          description: "[ADOPTED] Academy accounts a bank receipt's beneficiary must match (PAYMENT_VERIFICATION §3)."
        timezone:
          type: string
        ageReferenceRule:
          type: string
          enum:
            - jan_1_of_year
            - fixed_month_day
            - today
        ageReferenceMonthDay:
          type: string
          pattern: ^(0[1-9]|1[0-2])-(0[1-9]|[12][0-9]|3[01])$
          description: MM-DD; required when ageReferenceRule = fixed_month_day
        allowFractionalMoney:
          type: boolean
          description: false ⇒ every amount must be a multiple of 100 minor units
        coachCanSeeGuardianPhone:
          type: boolean
        attendanceCoachEditWindowHours:
          type: integer
          minimum: 0
        coachCheckinOpensMinutesBefore:
          type: integer
          minimum: 0
        coachCheckinClosesMinutesAfterEnd:
          type: integer
          minimum: 0
        invoiceLinkTtlDays:
          type: integer
          minimum: 1
      required:
        - name
        - paymentInstructions
        - beneficiaryAccounts
        - timezone
        - ageReferenceRule
        - allowFractionalMoney
        - coachCanSeeGuardianPhone
        - attendanceCoachEditWindowHours
        - coachCheckinOpensMinutesBefore
        - coachCheckinClosesMinutesAfterEnd
        - invoiceLinkTtlDays
    BillingSettings:
      type: object
      properties:
        billingFrequency:
          type: string
          enum:
            - weekly
            - monthly
        billingPeriodMode:
          type: string
          enum:
            - calendar
            - anchored
        weekStartDay:
          type: integer
          minimum: 1
          maximum: 7
        invoiceIssueTiming:
          type: string
          enum:
            - period_start
            - period_end
        dueRuleType:
          type: string
          enum:
            - days_after_issue
            - days_after_period_start
            - fixed_day_of_month
        dueRuleValue:
          type: integer
          minimum: 0
        effectNote:
          type: string
          description: 'Always: "Applies to invoices issued after now"'
      required:
        - billingFrequency
        - billingPeriodMode
        - weekStartDay
        - invoiceIssueTiming
        - dueRuleType
        - dueRuleValue
        - effectNote
    ReminderRule:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        kind:
          type: string
          enum:
            - pre_due
            - overdue
        offsetDays:
          type: integer
          description: Days before due (pre_due) or after due (overdue)
        isActive:
          type: boolean
      required:
        - id
        - kind
        - offsetDays
        - isActive
    MessageTemplate:
      type: object
      properties:
        key:
          type: string
          enum:
            - invoice_delivery
            - reminder_pre_due
            - reminder_overdue
        label:
          type: string
        body:
          type: string
        variables:
          type: array
          items:
            type: string
          description: Allowed {{variables}} for this template
        preview:
          type: string
          description: Rendered server-side with sample data
      required:
        - key
        - body
        - variables
    MessagingSettings:
      type: object
      properties:
        sendWindowStart:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        sendWindowEnd:
          type: string
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
        invoiceMode:
          type: string
          enum:
            - link
            - attachment_and_link
          description: attachment_and_link is rejected (422) until spike S1 confirms document sends
        pacingMinSeconds:
          type: integer
          minimum: 0
        pacingMaxSeconds:
          type: integer
          minimum: 0
        maxPerHour:
          type: integer
          minimum: 1
        optOutKeywords:
          type: array
          items:
            type: string
        consentPolicyText:
          type: string
          description: "[ADOPTED] Consent wording the forms ship with (PAGE_SPECIFICATIONS §9)"
      required:
        - sendWindowStart
        - sendWindowEnd
        - invoiceMode
        - pacingMinSeconds
        - pacingMaxSeconds
        - maxPerHour
        - optOutKeywords
    Automations:
      type: object
      properties:
        invoiceDelivery:
          type: boolean
        reminderPreDue:
          type: boolean
        reminderOverdue:
          type: boolean
        proofCheck:
          type: boolean
      required:
        - invoiceDelivery
        - reminderPreDue
        - reminderOverdue
        - proofCheck
    AutomationsResponse:
      allOf:
        - $ref: "#/components/schemas/Automations"
        - type: object
          properties:
            masterPaused:
              type: boolean
              description: Read-only mirror of messaging_automation_enabled (MSG-07), inverted
          required:
            - masterPaused
    AgeGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        name:
          type: string
          maxLength: 120
        minAge:
          type: integer
        maxAge:
          type: integer
        sortOrder:
          type: integer
        archivedAt:
          type: string
          format: date-time
          description: Instant, ISO-8601 UTC
        currentFeeMinor:
          type: integer
          description: Owner only — absent for coaches
        activePlayerCount:
          type: integer
      required:
        - id
        - name
        - sortOrder
    GroupFee:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        ageGroupId:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        amountMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        effectiveFrom:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        effectiveTo:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
      required:
        - id
        - ageGroupId
        - amountMinor
        - effectiveFrom
    AgeGroupSuggestion:
      type: object
      properties:
        referenceDate:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        ageOnReference:
          type: integer
        suggestions:
          type: array
          items:
            type: object
            properties:
              ageGroupId:
                type: string
                format: uuid
                description: UUID (UUIDv7; sorts by creation time)
              name:
                type: string
            required:
              - ageGroupId
              - name
      required:
        - referenceDate
        - ageOnReference
        - suggestions
    CoachRow:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        groups:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
                description: UUID (UUIDv7; sorts by creation time)
              name:
                type: string
            required:
              - id
              - name
      required:
        - user
        - groups
    CoachAssignment:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        coachUserId:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        coachName:
          type: string
        ageGroup:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            name:
              type: string
          required:
            - id
            - name
        assignedFrom:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        assignedTo:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
      required:
        - id
        - coachUserId
        - coachName
        - ageGroup
        - assignedFrom
    Guardian:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        fullName:
          type: string
          maxLength: 120
        phone:
          type: string
          description: E.164
        relationship:
          type: string
        whatsappConsent:
          type: string
          enum:
            - unknown
            - granted
            - revoked
        consentRecordedAt:
          type: string
          format: date-time
          description: Instant, ISO-8601 UTC
        consentSource:
          type: string
        optedOutAt:
          type: string
          format: date-time
          description: Instant, ISO-8601 UTC
      required:
        - id
        - fullName
        - phone
        - whatsappConsent
    PlayerGuardianLink:
      type: object
      properties:
        guardian:
          $ref: "#/components/schemas/Guardian"
        isPrimary:
          type: boolean
        receivesInvoices:
          type: boolean
      required:
        - guardian
        - isPrimary
        - receivesInvoices
    GuardianWithPlayers:
      allOf:
        - $ref: "#/components/schemas/Guardian"
        - type: object
          properties:
            players:
              type: array
              items:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: UUID (UUIDv7; sorts by creation time)
                  fullName:
                    type: string
                required:
                  - id
                  - fullName
          required:
            - players
    Player:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        registrationNo:
          type: string
        fullName:
          type: string
          maxLength: 120
        dateOfBirth:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        ageOnReference:
          type: integer
        registrationDate:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        status:
          type: string
          enum:
            - active
            - inactive
            - withdrawn
        statusEffectiveDate:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        statusReason:
          type: string
        currentGroup:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            name:
              type: string
            since:
              type: string
              format: date
              description: Business date, academy-local (YYYY-MM-DD)
          required:
            - id
            - name
            - since
        guardians:
          type: array
          items:
            $ref: "#/components/schemas/PlayerGuardianLink"
        notes:
          type: string
          maxLength: 1000
          description: Owner only
        coachNotes:
          type: string
          maxLength: 500
        billingAnchorDate:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        outstandingMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        version:
          type: integer
      required:
        - id
        - registrationNo
        - fullName
        - registrationDate
        - status
        - statusEffectiveDate
        - guardians
        - billingAnchorDate
        - version
    PlayerCoachView:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        registrationNo:
          type: string
        fullName:
          type: string
        age:
          type: integer
        status:
          type: string
          enum:
            - active
            - inactive
            - withdrawn
        group:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            name:
              type: string
          required:
            - id
            - name
        coachNotes:
          type: string
        primaryGuardian:
          type: object
          properties:
            fullName:
              type: string
            phone:
              type: string
          required:
            - fullName
            - phone
          description: Only when academy_settings.coach_can_see_guardian_phone is true
      required:
        - id
        - registrationNo
        - fullName
        - status
      description: "Strict allow-list: a coach payload never carries a financial or DOB field"
    PlayerListItem:
      anyOf:
        - $ref: "#/components/schemas/Player"
        - $ref: "#/components/schemas/PlayerCoachView"
    PlayerCreate:
      type: object
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 120
        dateOfBirth:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        registrationDate:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        ageGroupId:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        notes:
          type: string
          maxLength: 1000
        coachNotes:
          type: string
          maxLength: 500
        guardians:
          type: array
          items:
            type: object
            properties:
              guardianId:
                type: string
                format: uuid
                description: Link an existing guardian
              fullName:
                type: string
                minLength: 2
                maxLength: 120
                description: Create a new guardian
              phone:
                type: string
                description: Required with fullName; normalized to E.164
              relationship:
                type: string
                maxLength: 60
              whatsappConsent:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - granted
                      - unknown
                  source:
                    type: string
                required:
                  - status
                  - source
              isPrimary:
                type: boolean
                description: Exactly one entry per player must be primary
              receivesInvoices:
                type: boolean
            required:
              - isPrimary
              - receivesInvoices
            additionalProperties: false
          minItems: 1
        acknowledgeDuplicates:
          type: boolean
          description: Required to pass a duplicate warning
      required:
        - fullName
        - registrationDate
        - guardians
      additionalProperties: false
    GroupHistoryEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        ageGroup:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            name:
              type: string
          required:
            - id
            - name
        effectiveFrom:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        effectiveTo:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        reason:
          type: string
        changedBy:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            fullName:
              type: string
          required:
            - id
            - fullName
      required:
        - id
        - ageGroup
        - effectiveFrom
        - changedBy
    DuplicateMatch:
      type: object
      properties:
        player:
          $ref: "#/components/schemas/PlayerListItem"
        reason:
          type: string
        score:
          type: number
          description: Advisory similarity score (0–1)
      required:
        - player
        - reason
        - score
    GuardianBalance:
      type: object
      properties:
        outstandingMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        overdueMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        creditMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        openInvoices:
          type: array
          items:
            $ref: "#/components/schemas/Invoice"
          description: Open invoices behind the outstanding figure (GDN-06)
      required:
        - outstandingMinor
        - overdueMinor
        - creditMinor
    Invoice:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: UUID (UUIDv7; sorts by creation time)
        invoiceNumber:
          type: string
        kind:
          type: string
          enum:
            - periodic
            - manual
        status:
          type: string
          enum:
            - issued
            - partially_paid
            - paid
            - void
        isOverdue:
          type: boolean
          description: Derived, never stored (ADR-010)
        daysOverdue:
          type: integer
        player:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            fullName:
              type: string
            registrationNo:
              type: string
          required:
            - id
            - fullName
            - registrationNo
        guardian:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            fullName:
              type: string
          required:
            - id
            - fullName
        ageGroup:
          type: object
          properties:
            id:
              type: string
              format: uuid
              description: UUID (UUIDv7; sorts by creation time)
            name:
              type: string
          required:
            - id
            - name
        periodStart:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        periodEnd:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        issueDate:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        dueDate:
          type: string
          format: date
          description: Business date, academy-local (YYYY-MM-DD)
        currency:
          type: string
          enum:
            - LKR
        subtotalMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        adjustmentsMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        totalMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        paidMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
        balanceMinor:
          type: integer
          description: Money in integer minor units (LKR); never a float. Field names end in `Minor`.
