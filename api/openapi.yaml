  parameters: {}
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: ia_session
      description: Opaque session token; HttpOnly, Secure, SameSite=Lax (AUTH §1)
    webhookSignature:
      type: apiKey
      in: header
      name: X-OpenWA-Signature
      description: "`sha256=<hex>` HMAC-SHA256 over the exact raw body, constant-time compared before JSON parsing (OPENWA_INTEGRATION §9)"
paths:
  /auth/login:
    post:
      operationId: AUTH-01
      summary: Sign in with username and password
      description: "Sets the `ia_session` cookie (HttpOnly; Secure; SameSite=Lax) and returns `Me` including a fresh CSRF token. The session token is rotated on every login. Failures are always the same generic `INVALID_CREDENTIALS` (no account enumeration). No `X-CSRF-Token` is required (no session exists yet), but the `Origin`/`Referer` allow-list is still enforced. Audit: every attempt is recorded (success and failure)."
      tags:
        - Auth
      security: []
      x-ia-endpoint: AUTH-01
      x-ia-milestone: m2
      x-ia-audit: auth.login
      x-ia-ratelimit: login
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  pattern: ^[a-z0-9._-]{3,32}$
                  description: Case-insensitive; stored lower-case (ADR-018)
                password:
                  type: string
                  minLength: 1
                totpCode:
                  type: string
                  pattern: ^[0-9]{6}$
                  description: Required when the account has TOTP enabled; missing ⇒ 401 TOTP_REQUIRED is NOT used — see handoff
              required:
                - username
                - password
              additionalProperties: false
      responses:
        "200":
          description: Signed in; session cookie set and CSRF token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: INVALID_CREDENTIALS — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: &a1
                $ref: "#/components/schemas/ApiError"
        "403":
          description: ACCOUNT_LOCKED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "429":
          description: RATE_LIMITED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
  /auth/logout:
    post:
      operationId: AUTH-02
      summary: Sign out of the current session
      description: Revokes only the current session row; the cookie is cleared.
      tags:
        - Auth
      security:
        - sessionCookie: []
      x-ia-endpoint: AUTH-02
      x-ia-milestone: m2
      x-ia-audit: auth.logout
      x-ia-mutating: true
      responses:
        "204":
          description: Session revoked and cookie cleared
        "401":
          description: UNAUTHENTICATED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "403":
          description: CSRF_FAILED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "422":
          description: VALIDATION_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
  /auth/me:
    get:
      operationId: AUTH-03
      summary: Current user, permissions and a fresh CSRF token
      description: "Also the CSRF recovery path: after a 403 CSRF_FAILED the frontend calls this to obtain a new token and retries once. Coaches receive `assignedGroupIds`."
      tags:
        - Auth
      security:
        - sessionCookie: []
      x-ia-endpoint: AUTH-03
      x-ia-milestone: m2
      responses:
        "200":
          description: The caller's identity, permissions and academy summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          description: UNAUTHENTICATED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
  /auth/change-password:
    post:
      operationId: AUTH-04
      summary: Change the caller's password
      description: Revokes every other session of this user; the current session survives.
      tags:
        - Auth
      security:
        - sessionCookie: []
      x-ia-endpoint: AUTH-04
      x-ia-milestone: m2
      x-ia-audit: auth.change_password
      x-ia-mutating: true
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                  minLength: 1
                newPassword:
                  type: string
                  minLength: 12
                  description: ≥ 12 chars, not the username, not in the bundled common-password list
              required:
                - currentPassword
                - newPassword
              additionalProperties: false
      responses:
        "204":
          description: Password changed; other sessions revoked
        "401":
          description: UNAUTHENTICATED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "403":
          description: CSRF_FAILED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "422":
          description: VALIDATION_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "429":
          description: RATE_LIMITED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
  /auth/accept-invite:
    post:
      operationId: AUTH-05
      summary: Accept an invite (or password-reset link) and set a password
      description: Single use, 72 h TTL, token stored only as a SHA-256 hash. On success the user becomes `active`, is signed in, and `Me` is returned. No CSRF token is required (no session exists yet). An invalid/expired/used token returns the same generic error for every failure kind.
      tags:
        - Auth
      security: []
      x-ia-endpoint: AUTH-05
      x-ia-milestone: m2
      x-ia-audit: auth.accept_invite
      x-ia-ratelimit: auth
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                  minLength: 16
                password:
                  type: string
                  minLength: 12
              required:
                - token
                - password
              additionalProperties: false
      responses:
        "200":
          description: Password set; invite consumed; signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "422":
          description: VALIDATION_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "429":
          description: RATE_LIMITED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
  /auth/sessions:
    get:
      operationId: AUTH-06.list
      summary: List the caller's active sessions
      tags:
        - Auth
      security:
        - sessionCookie: []
      x-ia-endpoint: AUTH-06
      x-ia-milestone: m2
      responses:
        "200":
          description: Own sessions, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/AuthSession"
                required:
                  - data
        "401":
          description: UNAUTHENTICATED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
  /auth/sessions/{id}:
    delete:
      operationId: AUTH-06.revoke
      summary: Revoke one of the caller's sessions
      description: Only the caller's own sessions can be revoked; another user's id ⇒ 404.
      tags:
        - Auth
      security:
        - sessionCookie: []
      x-ia-endpoint: AUTH-06
      x-ia-milestone: m2
      x-ia-audit: auth.session_revoke
      x-ia-mutating: true
      parameters:
        - schema:
            type: string
            description: Session id from AUTH-06
          required: true
          description: Session id from AUTH-06
          name: id
          in: path
      responses:
        "204":
          description: Session revoked
        "401":
          description: UNAUTHENTICATED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "403":
          description: CSRF_FAILED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "422":
          description: VALIDATION_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
  /auth/totp/enroll:
    post:
      operationId: AUTH-07.enroll
      summary: Start TOTP enrolment
      description: Returns an `otpauth://` URI for the authenticator app. Nothing is enforced until AUTH-07 confirm succeeds. The secret is stored encrypted (TOTP_ENCRYPTION_KEY). Recovery for a locked-out owner is the server-side `reset-owner` CLI.
      tags:
        - Auth
      security:
        - sessionCookie: []
      x-ia-endpoint: AUTH-07
      x-ia-milestone: m2
      x-ia-audit: auth.totp_enroll
      x-ia-mutating: true
      responses:
        "200":
          description: Enrolment started
          content:
            application/json:
              schema:
                type: object
                properties:
                  secretUri:
                    type: string
                    description: otpauth:// URI, shown once
                required:
                  - secretUri
        "401":
          description: UNAUTHENTICATED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "403":
          description: CSRF_FAILED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "409":
          description: INVALID_STATE_TRANSITION — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "422":
          description: VALIDATION_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
