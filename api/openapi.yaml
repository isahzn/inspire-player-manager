      operationId: WHK-01
      summary: Provider event webhook
      description: "Not a user route: authenticated by the `X-OpenWA-Signature` HMAC-SHA256 over the exact raw body, compared constant-time **before** JSON parsing, with a 256 KB body cap and an IP allow-list in front. Repeats of a `X-OpenWA-Delivery-Id` are deduped (OpenWA retries automatically and may deliver out of order), `X-OpenWA-Retry-Count` is logged, and an unknown event type is acknowledged with 204 rather than failing. Inbound text is never stored — only the exact configured opt-out keywords from a known guardian number are acted on. Delivery state is updated monotonically, so an out-of-order event can never lower it."
      tags:
        - Messaging
      security:
        - webhookSignature: []
      x-ia-endpoint: WHK-01
      x-ia-milestone: m7
      x-ia-mutating: true
      x-ia-ratelimit: webhook
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                event:
                  type: string
                sessionId:
                  type: string
                messageId:
                  type: string
                ack:
                  type: number
                from:
                  type: string
                body:
                  type: string
      responses:
        "204":
          description: Accepted; nothing to report
        "403":
          description: CSRF_FAILED — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "422":
          description: VALIDATION_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
        "500":
          description: INTERNAL_ERROR — see API_CONTRACTS §1.1.
          content:
            application/json:
              schema: *a1
